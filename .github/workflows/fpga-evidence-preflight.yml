name: fpga-evidence-preflight
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          python3 scripts/verify_raw_checkout.py
          python3 -m unittest discover -s tests -p 'test_verify_raw_checkout.py' -q
      - name: Run bounded standalone preflight tests (not performance benchmarks)
        run: python3 -m unittest discover -s tests -p 'test_*.py'
